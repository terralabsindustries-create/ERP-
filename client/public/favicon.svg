<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SerpY">
  <!--
    The SerpY compass mark: one blade drawn once, then rotated 90 degrees four
    times around the centre, alternating black and the brand salmon (#FE9371,
    sampled from src/assets/serpyLogo.jpeg). The stroke is the same colour as
    the fill purely to round the corners, matching the logo artwork.
    The white disc keeps the mark legible on dark browser tabs.
  -->
  <defs>
    <path id="serpy-blade" d="M6.5 29.76 L25.5 12.4 L25.5 29.76 Z" />
  </defs>

  <circle cx="32" cy="32" r="29" fill="#ffffff" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#000000" stroke-width="2.1" />

  <g stroke-width="1.2" stroke-linejoin="round">
    <use href="#serpy-blade" fill="#000000" stroke="#000000" />
    <use href="#serpy-blade" fill="#FE9371" stroke="#FE9371" transform="rotate(90 32 32)" />
    <use href="#serpy-blade" fill="#000000" stroke="#000000" transform="rotate(180 32 32)" />
    <use href="#serpy-blade" fill="#FE9371" stroke="#FE9371" transform="rotate(270 32 32)" />
  </g>
</svg>
