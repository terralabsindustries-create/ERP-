# Builds and publishes the Terralabs ERP desktop app.
#
# Every push to main produces a new version and publishes the installers to the
# public releases repository. Installed copies check that feed on launch, tell
# the user a new version is available, and install it when they agree.
#
# Windows installers cannot be produced reliably on a Mac, so each platform is
# built on its own runner.
#
# Repository secrets:
#   RELEASES_TOKEN — required for automatic publishing, with `contents: write`
#                    on Akbarhaleel1/serpy-releases. Without it the installers
#                    are still built and uploaded as workflow artifacts.
#   MONGODB_URI    — the company's own Atlas connection string. Every install
#                    of the app talks to this one database; it is baked into
#                    the installer here and never entered by an end user. See
#                    desktop/build/embed-config.cjs and desktop/README.md.
#   JWT_SECRET     — long random string, generate once with:
#                      node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#   EMAIL_USER, EMAIL_PASS — optional; system mailbox for OTP/invitation email.
name: Desktop build

on:
  push:
    branches: [main]
    # Documentation-only edits should not ship a new app version.
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: Terralabs-ERP-macOS
          - os: windows-latest
            target: --win
            artifact: Terralabs-ERP-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One version per push, so every build is newer than the last and the
      # updater has something to compare against. 1.1.x: the feed already holds
      # SerpY builds up to 1.0.27 from the previous repository, whose run numbers
      # this repository does not continue — 1.0.<run> here would rank below them.
      - name: Set version from run number
        working-directory: desktop
        run: npm version 1.1.${{ github.run_number }} --no-git-tag-version --allow-same-version

      # The installer carries the backend and its dependencies. Puppeteer's
      # Chromium is skipped — the app uses the Chrome/Edge already on the machine.
      - name: Install backend dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --omit=dev

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build renderer
        working-directory: desktop
        run: npm run build:renderer

      # Writes desktop/build/app.env, which extraResources then bundles into
      # the installer as resources/app.env. Fails the build if the secrets
      # below are not configured on this repository — nothing silently ships
      # without a database to connect to.
      - name: Embed database configuration
        working-directory: desktop
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: node build/embed-config.cjs

      - name: Build installer and publish when configured
        working-directory: desktop
        shell: bash
        env:
          # Publishing target lives in package.json → build.publish
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # No Apple Developer certificate — produces an unsigned macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [[ -n "$GH_TOKEN" ]]; then
            publish=always
          else
            publish=never
            echo '::warning::RELEASES_TOKEN is not configured. Building workflow artifacts without publishing a release.'
            echo 'Installers were built as workflow artifacts. Add RELEASES_TOKEN to publish them to the updater release repository.' >> "$GITHUB_STEP_SUMMARY"
          fi
          npx electron-builder ${{ matrix.target }} --publish "$publish"

      # Also attach the installers to this workflow run, so they can be grabbed
      # without going to the releases repository.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30
